name: Report a mistake in a score
description: Something on an agent's BoundBench page does not match its code.
title: "[agent-id] "
labels: ["score-correction"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for checking our work. Every score is pinned to one commit, so please point to the code that shows the mistake.

        Found a vulnerability in the agent itself? Do not post it here. Report it privately to that project's maintainers.
  - type: input
    id: agent
    attributes:
      label: Agent
      description: The agent id from the page URL, for example `adk-python`.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Pinned commit
      description: Shown on the agent page.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - A safeguard in the code was missed
        - The evidence does not show what the page says
        - The project changed after the pinned commit
        - Something else
    validations:
      required: true
  - type: input
    id: criterion
    attributes:
      label: Criterion
      description: C1 to C10, if the mistake is in one criterion.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links to the file and lines that show it, at the pinned commit or a newer one.
    validations:
      required: true
  - type: checkboxes
    id: maintainer
    attributes:
      label: About you
      options:
        - label: I maintain this project
