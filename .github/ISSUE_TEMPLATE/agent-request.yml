name: Request an agent
description: Ask for an open-source AI agent, framework or MCP server to be scored.
title: "Score "
labels: ["agent-request"]
body:
  - type: markdown
    attributes:
      value: |
        BoundBench scores open-source agents from their public source code. Check the leaderboard first in case it is already there.
  - type: input
    id: agent
    attributes:
      label: Agent name
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository URL
      description: The public source repository, for example https://github.com/owner/repo
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Optional. Who uses it, or what access it holds.
  - type: checkboxes
    id: maintainer
    attributes:
      label: About you
      options:
        - label: I maintain this project
